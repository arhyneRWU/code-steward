[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-steward"
version = "0.1.0"
description = "Context-efficient code intelligence and stewardship for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.9",
    # tomllib is stdlib from 3.11; tomli is its zero-dependency backport.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "ruff==0.16.3", "mypy==2.3.1"]
# Calibration only. Deliberately outside `dev` so the five-version CI
# matrix does not pay for a wheel to re-derive a committed number.
bench = ["tiktoken>=0.7"]

[project.scripts]
code-steward = "code_steward.cli:main"

[tool.code-steward]
# Fixture trees deliberately declare duplicate unit IDs; they are test
# data, not production source, so they must never enter the index.
exclude = [
    "tests/fixtures",
    "benchmarks/retrieval/fixture_repo",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src", "benchmarks"]
ignore_missing_imports = true
# Deliberately not strict. The value here is catching a call that
# cannot work -- a wrong argument count, a name used before it
# exists -- in the benchmark layer, which is half-covered by tests
# and needs 20 GB of pinned corpora to execute. Three broken
# `load_units` callers shipped to main while 331 tests passed; mypy
# found them in under a minute. Tightening beyond that is a separate
# decision with a separate cost.
#
# `warn_unused_ignores` is deliberately off. `config.py` imports
# tomllib on 3.11+ and falls back to tomli on 3.10, and the ignores
# that fallback needs are unused on the other version. With a
# supported range of 3.10 to 3.14, the check reports a false positive
# whichever version it is pointed at.

[tool.ruff]
line-length = 99
target-version = "py310"
required-version = "==0.16.3"

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle import/layout errors
    "E7",   # pycodestyle statement errors
    "E9",   # pycodestyle runtime/syntax errors
    "E501", # line length
    "W505", # docstring/comment line length
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PLE",  # Pylint errors implemented by Ruff
    "RUF",  # Ruff-specific correctness rules
    # pydocstyle: docstring formatting and consistency only. The
    # missing-docstring rules (D1xx) are deliberately deferred; see
    # docs/code-quality.md.
    "D200", # one-line docstring fits on one line
    "D201", # no blank line after the function docstring
    "D202", # no blank line before the function body
    "D204", # one blank line after a class docstring
    "D205", # blank line between summary and description
    "D207", # docstring is under-indented
    "D208", # docstring is over-indented
    "D209", # closing quotes on their own line
    "D210", # no surrounding whitespace in the docstring
    "D211", # no blank line before a class docstring
    "D212", # multi-line summary starts on the first line
    "D400", # first line ends with a period
    "D401", # first line is in the imperative mood
    "D402", # first line is not the signature
    "D403", # first word is capitalized
    "D404", # first word is not "This"
    "D418", # no docstring on an @overload stub
    "D419", # docstring is not empty
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
