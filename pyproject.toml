[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-steward"
version = "0.1.0"
description = "Context-efficient code intelligence and stewardship for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "ruff==0.16.3"]

[project.scripts]
code-steward = "code_steward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"
required-version = "==0.16.3"

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle import/layout errors
    "E7",   # pycodestyle statement errors
    "E9",   # pycodestyle runtime/syntax errors
    "E501", # line length
    "W505", # docstring/comment line length
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PLE",  # Pylint errors implemented by Ruff
    "RUF",  # Ruff-specific correctness rules
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
